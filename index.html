<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPMODS AUTH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0d1117,#111827,#0f172a);
    overflow:hidden;
}

/* Background animation */
body::before{
    content:'';
    position:absolute;
    width:300%;
    height:300%;
    background:radial-gradient(circle,#a100ff22 10%,transparent 30%);
    animation: moveBg 10s linear infinite;
}

@keyframes moveBg{
    0%{transform:translate(-20%,-20%);}
    50%{transform:translate(-10%,10%);}
    100%{transform:translate(-20%,-20%);}
}

.container{
    position:relative;
    width:350px;
    padding:40px 30px;
    border-radius:25px;
    background:rgba(20,20,30,0.95);
    border:1px solid rgba(255,0,255,0.3);
    box-shadow:
        0 0 15px #ff00ff55,
        0 0 30px #8a2be288;
    text-align:center;
    animation: fadeIn 1.5s ease;
    z-index:1;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.title{
    color:#ff00ff;
    font-size:28px;
    margin-bottom:10px;
    text-shadow:0 0 10px #ff00ff;
    animation: pulse 2s infinite;
}

.subtitle{
    color:#cfcfff;
    margin-bottom:30px;
    font-size:13px;
    letter-spacing:2px;
}

@keyframes pulse{
    0%,100%{
        text-shadow:0 0 8px #ff00ff;
    }
    50%{
        text-shadow:0 0 20px #ff00ff,0 0 35px #ff00ff;
    }
}

.otp-box{
    padding:25px;
    border:2px dashed #ff4444;
    border-radius:15px;
    background:#050505;
    margin-bottom:30px;
    box-shadow:0 0 15px #ff000055 inset;
}

.otp{
    color:#ff4444;
    font-size:48px;
    letter-spacing:8px;
    font-weight:bold;
    animation: blink 1.2s infinite;
}

@keyframes blink{
    0%,100%{opacity:1;}
    50%{opacity:0.6;}
}

.copy-btn{
    border:none;
    outline:none;
    padding:16px 45px;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
    color:white;
    background:linear-gradient(45deg,#ff00ff,#7a00ff);
    box-shadow:0 0 20px #c000ff88;
    transition:0.3s;
}

.copy-btn:hover{
    transform:scale(1.08);
    box-shadow:0 0 30px #ff00ff;
}

.msg{
    margin-top:15px;
    color:#00ff88;
    font-size:13px;
    opacity:0;
    transition:0.3s;
}
</style>
</head>
<body>

<div class="container">
    <div class="title">DPMODS AUTH</div>
    <div class="subtitle">SECURE OTP GENERATED</div>

    <div class="otp-box">
        <div class="otp" id="otp">5566</div>
    </div>

    <button class="copy-btn" onclick="copyOTP()">COPY OTP</button>
    <div class="msg" id="msg">OTP Copied!</div>
</div>

<script>
function copyOTP(){
    const otp = document.getElementById("otp").innerText;
    navigator.clipboard.writeText(otp);

    let msg = document.getElementById("msg");
    msg.style.opacity = "1";

    setTimeout(()=>{
        msg.style.opacity="0";
    },2000);
}
</script>

</body>
</html>
